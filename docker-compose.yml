services:
  frontend:
    build:
      context: ./gym-tracker-frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/backend/api}
    restart: unless-stopped
    expose:
      - "80"

  backend:
    build:
      context: ./gym-tracker-backend
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      FRONTEND_URL: ${FRONTEND_URL:-http://ogk-gym-tracker.koreacentral.cloudapp.azure.com}
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/backend/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONFIG:-./nginx/default.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
